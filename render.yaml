# URL Shortener - Render Blueprint (One-Click Deploy)

services:
  # Backend API (Express + Prisma + PostgreSQL + Redis)
  - type: web
    name: url-shortener-backend
    env: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: MACHINE_ID
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://url-shortener-frontend.onrender.com"
      - key: PUBLIC_BASE_URL
        value: "https://url-shortener-frontend.onrender.com"

  # Frontend (React SPA)
  - type: static
    name: url-shortener-frontend
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: "https://url-shortener-backend.onrender.com"

  # PostgreSQL Database
  - type: pserv
    name: url-shortener-postgres
    region: singapore
    plan: free
    databaseName: urlshortener
    maxconnections: 20

  # Redis Database
  - type: redis
    name: url-shortener-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
